server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # nginx defaults to 1m, which rejects admin document uploads (>1m -> 413).
    client_max_body_size 25m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Hashed static assets: serve directly.
    location /assets/ {
        try_files $uri =404;
    }

    # Backend API: everything the API serves lives under /api (verified), so scope
    # the proxy to /api/ only. A broader regex also matched SPA routes such as
    # /admin/*, shadowing the SPA fallback below and 404ing on hard reload.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Vertex AI generation is synchronous and can exceed nginx's 60s default (-> 504).
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SPA fallback.
    location / {
        try_files $uri /index.html;
    }
}